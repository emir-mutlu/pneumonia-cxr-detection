[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pneumonia-cxr"
version = "2.0.0"
description = "Pneumonia detection from chest X-rays with patient-level splits, external validation, calibration and quantitatively evaluated Grad-CAM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emir Mutlu" }]
keywords = ["deep-learning", "medical-imaging", "chest-x-ray", "pneumonia", "pytorch", "explainable-ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "timm>=1.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "pillow>=10",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "tqdm>=4.66",
  "typer>=0.12",
]

[project.optional-dependencies]
data = ["pydicom>=2.4"]
xrv = ["torchxrayvision>=1.2"]
serve = [
  "onnx>=1.16",
  "onnxscript>=0.1",
  "onnxruntime>=1.18",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]
track = ["mlflow>=2.12"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
pneumo = "pneumonia_cxr.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pneumonia_cxr"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "runs", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["pneumonia_cxr", "app"]

[tool.ruff.lint.per-file-ignores]
"src/pneumonia_cxr/report.py" = ["E501"]  # long Markdown table rows

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
