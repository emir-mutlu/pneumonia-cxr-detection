# Leave-one-hospital-out: trained without Kermany (Guangzhou children), which is then the unseen test site.
# Needs VinDr-PCXR (PhysioNet access). Recipe: dg (base = released recipe; dg = balanced + strong augmentation).
name: loso_rsna_vindr_dg
arch: convnext_tiny.fb_in22k_ft_in1k
sources: [rsna, vindr_pcxr]
epochs: 10
batch_size: 32
lr: 1.0e-4
weight_decay: 0.05
patience: 3
drop_path_rate: 0.1
augment: strong
balance_sources: true
